name: Afiax images

# Builds the Afiax FHIR server and web app images and publishes them to GHCR:
#   ghcr.io/oortcloudcomputing/afiax-server
#   ghcr.io/oortcloudcomputing/afiax-app
# Tags: the full commit SHA, plus `latest`.
#
# Secrets (repo settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN: read-only Docker Hub token, used only to pull
#   the Docker Hardened Images base (dhi.io/node). GHCR uses the built-in GITHUB_TOKEN.

concurrency:
  group: afiax-images-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [kenya]
    paths-ignore:
      - 'packages/docs/**'
      - 'examples/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SERVER_DOCKERHUB_REPOSITORY: ghcr.io/oortcloudcomputing/afiax-server
      APP_DOCKERHUB_REPOSITORY: ghcr.io/oortcloudcomputing/afiax-app
      DOCKER_PLATFORMS: linux/amd64
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # The app is built with placeholders; docker-entrypoint.sh swaps in real values at start-up.
      - name: Build
        run: npm run build:fast
        env:
          MEDPLUM_BASE_URL: '__MEDPLUM_BASE_URL__'
          MEDPLUM_CLIENT_ID: '__MEDPLUM_CLIENT_ID__'
          MEDPLUM_REGISTER_ENABLED: '__MEDPLUM_REGISTER_ENABLED__'
          MEDPLUM_AWS_TEXTRACT_ENABLED: '__MEDPLUM_AWS_TEXTRACT_ENABLED__'
          GOOGLE_CLIENT_ID: '__GOOGLE_CLIENT_ID__'
          RECAPTCHA_SITE_KEY: '__RECAPTCHA_SITE_KEY__'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub Hardened Images
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      - name: Build Server Docker Image
        run: ./scripts/build-docker-server.sh --latest
      - name: Build App Docker Image
        run: ./scripts/build-docker-app.sh --latest
